name: Sync Staging Database from Production

on:
  workflow_dispatch:

jobs:
  clone_database:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Write GCP Service Account Keys
        run: |
          echo '${{ secrets.GCP_SA_KEY_STAGING }}' > /tmp/gcp_staging.json
          echo '${{ secrets.GCP_SA_KEY_PRODUCTION }}' > /tmp/gcp_prod.json

      - name: Clone Production Database to Staging
        run: node scripts/clone-prod-to-staging.mjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS_PRODUCTION: /tmp/gcp_prod.json
          GOOGLE_APPLICATION_CREDENTIALS_STAGING: /tmp/gcp_staging.json

      - name: Remove Service Account Keys
        if: always()
        run: rm -f /tmp/gcp_staging.json /tmp/gcp_prod.json
