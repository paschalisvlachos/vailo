name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - staging
  workflow_dispatch:
    inputs:
      deploy:
        description: After tests pass, deploy Firebase Hosting to
        type: choice
        options:
          - none
          - staging
          - production
        default: none

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install App Dependencies
        run: npm ci

      - name: Run App Unit Tests
        run: npm run test:app

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Run Functions Unit Tests
        working-directory: functions
        run: npm test

  deploy-staging:
    needs: unit
    if: |
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/staging' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'staging')
      )
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  deploy-production:
    needs: unit
    if: |
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'production')
      )
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
